<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resumo Executivo</title>
<style>
@page {
  size: A4;
  margin: 22mm 20mm 20mm 20mm;
  @bottom-center {
    content: "As Gêmeas e o Número — Resumo Executivo · " counter(page) " / " counter(pages);
    font-family: "Liberation Sans", Arial, sans-serif;
    font-size: 8.2pt;
    color: #6b6b6b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family: "Liberation Serif", Georgia, "Times New Roman", serif;
  font-size: 10.6pt;
  line-height: 1.52;
  color: #1a1a1a;
}
.head{
  border-bottom: 1.6pt solid #1a1a1a;
  padding-bottom: 10pt;
  margin-bottom: 18pt;
}
.head h1{
  font-family: "Liberation Sans", Arial, sans-serif;
  font-weight: 700;
  font-size: 18.5pt;
  letter-spacing: -0.01em;
  margin: 0 0 3pt;
}
.head .sub{
  font-family: "Liberation Sans", Arial, sans-serif;
  font-size: 9pt;
  color: #444;
  margin: 0 0 9pt;
}
.head .autor{
  font-family: "Liberation Sans", Arial, sans-serif;
  font-size: 8.6pt;
  color: #333;
  line-height: 1.55;
}
.head .autor a{color:#333}
.head .nota{
  font-style: italic;
  font-size: 9.3pt;
  color: #333;
  margin-top: 8pt;
  border-left: 2pt solid #999;
  padding-left: 9pt;
}

h2{
  font-family: "Liberation Sans", Arial, sans-serif;
  font-weight: 700;
  font-size: 12.3pt;
  letter-spacing: -0.005em;
  margin: 20pt 0 8pt;
  padding-top: 11pt;
  border-top: 0.6pt solid #ccc;
  page-break-after: avoid;
}
h2:first-of-type{border-top: 0}
p{margin: 0 0 9pt; text-align: justify; orphans: 3; widows: 3}
strong{font-weight: 700}
em{font-style: italic}
blockquote{
  margin: 9pt 0; padding: 6pt 0 6pt 11pt;
  border-left: 2pt solid #999;
  font-size: 9.8pt; color: #333;
}
code{
  font-family: "DejaVu Sans Mono", monospace;
  font-size: 9pt;
  background: #f1f1ef;
  padding: 1pt 3pt;
  border-radius: 2pt;
}
pre{
  font-family: "DejaVu Sans Mono", monospace;
  font-size: 8.8pt;
  background: #f1f1ef;
  border: 0.5pt solid #ddd;
  border-radius: 3pt;
  padding: 8pt 10pt;
  margin: 8pt 0;
  white-space: pre-wrap;
  page-break-inside: avoid;
}
table{
  border-collapse: collapse;
  width: 100%;
  margin: 9pt 0 12pt;
  font-size: 9.6pt;
  page-break-inside: avoid;
}
th{
  font-family: "Liberation Sans", Arial, sans-serif;
  font-weight: 700;
  font-size: 8pt;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: #444;
  text-align: left;
  padding: 5pt 8pt;
  border-bottom: 1pt solid #1a1a1a;
}
td{
  padding: 6pt 8pt;
  border-bottom: 0.4pt solid #ddd;
  vertical-align: top;
}
tr:last-child td{border-bottom: 0.8pt solid #1a1a1a}
td:first-child{font-family: "Liberation Sans", Arial, sans-serif; font-weight:700; color:#555}
hr{border:0; border-top: 0.6pt solid #ccc; margin: 14pt 0}
.foot{
  margin-top: 16pt; padding-top: 10pt; border-top: 1pt solid #1a1a1a;
  font-family: "Liberation Sans", Arial, sans-serif;
  font-size: 8.4pt; color: #333; line-height: 1.6;
}
.foot blockquote{font-family: "Liberation Serif", Georgia, serif; font-size: 9.6pt}
a{color:#1a1a1a}
</style>
</head>
<body>
__CORPO__
</body>
</html>
