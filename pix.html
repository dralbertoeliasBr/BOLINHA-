<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16091F">
  <title>Apoie o projeto · Sounavy</title>
  <style>
    :root{color-scheme:dark;--bg:#16091F;--card:#20102D;--text:#EFEAE1;--muted:#A093AE;--accent:#C9A6FF;--border:rgba(239,234,225,.16)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,sans-serif;display:grid;place-items:center}
    main{width:min(100%,520px);padding:28px;background:var(--card);border:1px solid var(--border);border-radius:16px}
    h1{font-size:clamp(25px,7vw,34px);line-height:1.2;margin:0 0 12px}
    p{color:var(--muted)}
    .label{font-size:13px;margin:24px 0 6px}
    code{display:block;padding:14px;border:1px solid var(--border);border-radius:10px;background:#16091F;color:var(--text);font:600 16px/1.4 ui-monospace,monospace;overflow-wrap:anywhere}
    button,a{display:inline-block;margin:12px 8px 0 0;padding:12px 16px;border:0;border-radius:8px;background:var(--accent);color:#16091F;font:600 15px system-ui,sans-serif;text-decoration:none;cursor:pointer}
    a.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    #status{min-height:1.5em;font-size:14px}
    .note{font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>Apoie este projeto</h1>
    <p>Se este trabalho lhe foi útil, você pode contribuir por Pix. A doação é voluntária.</p>
    <p class="label"><strong>Chave Pix (e-mail)</strong></p>
    <code id="pix">iashumanos@gmail.com</code>
    <button id="copy" type="button">Copiar chave Pix</button>
    <a class="secondary" href="https://sounavy.com/">Voltar ao Sounavy</a>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">Antes de confirmar uma transferência, confira no aplicativo do seu banco o nome do destinatário e os dados da transação.</p>
  </main>
  <script>
    const key = document.getElementById('pix').textContent;
    const status = document.getElementById('status');
    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(key);
        status.textContent = 'Chave Pix copiada.';
      } catch {
        status.textContent = 'Não foi possível copiar automaticamente. Selecione e copie a chave exibida.';
      }
    });
  </script>
</body>
</html>
