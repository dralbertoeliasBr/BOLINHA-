<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto novo 01</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f4;color:#142b28;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
      main{max-width:560px;width:100%;background:#fff;border:1px solid #d8e2de;border-radius:16px;padding:28px;box-shadow:0 2px 8px rgba(23,60,48,.08)}
      .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#e6efeb;color:#0b554b;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
      h1{margin:18px 0 10px;font-size:clamp(28px,6vw,38px)}
      p{color:#60736e;line-height:1.6}
      a{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:10px;background:#0b554b;color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <div class="tag">GitHub</div>
      <h1>Projeto novo 01</h1>
      <p>Este repositório ainda está vazio e será preenchido com conteúdo futuro. Por enquanto ele funciona como porta de entrada para a área do GitHub.</p>
      <a href="https://github.com" target="_blank" rel="noreferrer">Abrir GitHub</a>
    </main>
  </body>
</html>
